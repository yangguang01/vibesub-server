[providers.openai]
kind = "llm"
api_key_env = "OPENAI_API_KEY"
base_url = ""
timeout = 1200
temperature = 0.3
top_p = 0.7

[providers.deepseek]
kind = "llm"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
timeout = 1200
temperature = 0.3
top_p = 0.7

[providers.kimi]
kind = "llm"
api_key_env = "MOONSHOT_API_KEY"
base_url_env = "MOONSHOT_BASE_URL"
base_url = "https://api.moonshot.ai/v1"
timeout = 1200
temperature = 1.0
top_p = 0.95

[providers.assemblyai]
kind = "asr"
api_key_env = "ASSEMBLYAI_API_KEY"
timeout = 1200

[providers.firebase_admin]
kind = "firebase_admin"
credentials_env = "GOOGLE_APPLICATION_CREDENTIALS"

[providers.firestore_main]
kind = "firestore"
project_env = "GOOGLE_CLOUD_PROJECT"

[providers.storage_main]
kind = "storage"
project_env = "GOOGLE_CLOUD_PROJECT"
bucket_env = "STORAGE_BUCKET"
bucket = "tube-trans.firebasestorage.app"

[providers.cloud_tasks_main]
kind = "queue"
project_env = "GOOGLE_CLOUD_PROJECT"
location = "us-west1"
queue = "vibesub-queue"
target_url_env = "WORKER_SERVICE_URL"
auth_mode = "oidc"

[providers.youtube_default]
kind = "youtube"
proxy_env = "PROXY_URL"
force_ipv4 = true
socket_timeout = 60
retries = 2

[llm.translation]
provider = "kimi"
model = "kimi-k2.5"
temperature_main = 1.0
top_p_main = 0.95
temperature_strict = 1.0
top_p_strict = 0.95
temperature_fallback = 1.0
top_p_fallback = 0.95

[llm.context]
provider = "kimi"
model = "kimi-k2.5"
temperature = 1.0
top_p = 0.95

[llm.alignment]
provider = "kimi"
model = "kimi-k2.5"
temperature = 1.0
top_p = 0.95
mode = "enforce"
max_validator_retries = 2
max_content_retries = 3
fallback_chunk_size = 12

[llm.sentence_splitter]
provider = "kimi"
model = "kimi-k2.5"
temperature = 1.0
top_p = 0.95

[runtime]
max_concurrent_tasks = 5
retry_attempts = 2
batch_size = 50

[tasks.transcription_main]
provider = "assemblyai"

[tasks.subtitle_storage]
provider = "storage_main"
path_prefix = "cn_srt"

[tasks.asr_storage]
provider = "storage_main"
path_prefix = "asr_srt"

[tasks.debug_storage]
provider = "storage_main"
path_prefix = "debug_records"

[tasks.translation_dispatch]
provider = "cloud_tasks_main"
path = "/internal/cloud-tasks/process-translation"

[tasks.youtube_probe]
provider = "youtube_default"

[tasks.youtube_audio_download]
provider = "youtube_default"

[tasks.youtube_auto_subtitle_download]
provider = "youtube_default"
